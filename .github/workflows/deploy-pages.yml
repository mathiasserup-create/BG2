name: Deploy Søhøjlandets Dødsbo til GitHub Pages

on:
  push:
    branches: ["claude/sohoejlandets-begravelser-website-xerqrk"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site (kun website-mappen)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./soehoejlandets-doedsbo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
